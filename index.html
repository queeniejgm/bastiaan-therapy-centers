<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bastiaan's Therapy Centers</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --best: #dcfce7; --best-text: #166534;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1b1f26; --text: #e6e8eb; --muted: #9aa1ab;
      --border: #2c323b; --accent: #60a5fa; --best: #14361f; --best-text: #86efac;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .tile .label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .tile .price { font-size: 1.4rem; font-weight: 700; color: var(--best-text); }
  .tile .who { font-size: .9rem; }

  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.best { background: var(--best); color: var(--best-text); font-weight: 700; }
  .name { font-weight: 600; }
  a { color: var(--accent); }
  details { margin-top: 6px; font-size: .9rem; }
  summary { cursor: pointer; color: var(--accent); }
  .qa { margin: 6px 0 0; padding-left: 0; list-style: none; }
  .qa li { margin-bottom: 6px; }
  .qa b { display: block; }
  .muted { color: var(--muted); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }

  /* Phones: rows become cards */
  @media (max-width: 720px) {
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    table { background: none; border: 0; }
    tr { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; padding: 4px 0; }
    td { border: 0; padding: 6px 14px; }
    td.num { display: flex; justify-content: space-between; text-align: left; }
    td[data-label]::before { content: attr(data-label); color: var(--muted); font-weight: 400; margin-right: 12px; }
    td.name-cell::before { content: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Bastiaan's Therapy Centers</h1>
  <p class="sub">Green = cheapest for that rate.</p>

  <section class="summary" id="summary"></section>

  <div class="controls">
    <label for="mode">Rates</label>
    <select id="mode">
      <option value="pwd" selected>With PWD ID</option>
      <option value="regular">Regular</option>
    </select>
    <label for="sort">Sort by</label>
    <select id="sort">
      <option value="name">Name</option>
      <option value="otAssessment">OT assessment</option>
      <option value="otSession">OT session</option>
      <option value="stAssessment">ST assessment</option>
      <option value="stSession">ST session</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Center</th>
        <th class="num">OT assessment</th>
        <th class="num">OT session</th>
        <th class="num">ST assessment</th>
        <th class="num">ST session</th>
        <th>Schedule</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<script src="data.js"></script>
<script>
  const RATES = [
    ["otAssessment", "OT assessment"],
    ["otSession", "OT session"],
    ["stAssessment", "ST assessment"],
    ["stSession", "ST session"],
  ];

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = n => n == null ? "—" : CURRENCY + Number(n).toLocaleString();
  const mapsLink = c => c.mapsUrl || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(c.address || c.name);

  const modeEl = document.getElementById("mode");
  // In PWD mode, use the PWD rate if the center has one, else fall back to regular.
  const rate = (c, k) => modeEl.value === "pwd" ? (c.pwdRates?.[k] ?? c.rates?.[k]) : c.rates?.[k];
  const isFallback = (c, k) => modeEl.value === "pwd" && c.pwdRates?.[k] == null && c.rates?.[k] != null;

  // Lowest value per rate (ignores missing)
  const best = {};
  function computeBest() {
    for (const [k] of RATES) {
      const vals = CENTERS.map(c => rate(c, k)).filter(v => v != null);
      best[k] = vals.length ? Math.min(...vals) : null;
    }
  }

  function renderSummary() {
    document.getElementById("summary").innerHTML = RATES.map(([k, label]) => {
      const who = CENTERS.filter(c => best[k] != null && rate(c, k) === best[k]).map(c => esc(c.name)).join(", ");
      return `<div class="tile"><div class="label">Cheapest ${label}</div>
        <div class="price">${money(best[k])}</div><div class="who">${who || '<span class="muted">No data yet</span>'}</div></div>`;
    }).join("");
  }

  function renderRows() {
    const key = document.getElementById("sort").value;
    const list = [...CENTERS].sort((a, b) => {
      if (key === "name") return a.name.localeCompare(b.name);
      const x = rate(a, key), y = rate(b, key);
      return (x ?? Infinity) - (y ?? Infinity);
    });

    const tbody = document.getElementById("rows");
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">No centers added yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(c => {
      const rateCells = RATES.map(([k, label]) => {
        const v = rate(c, k);
        const isBest = v != null && v === best[k];
        const tag = isFallback(c, k) ? ' <small class="muted">(regular)</small>' : "";
        return `<td class="num${isBest ? " best" : ""}" data-label="${label}"><span>${money(v)}${tag}</span></td>`;
      }).join("");

      const notes = (c.notes || []).length
        ? `<details><summary>Details (${c.notes.length})</summary><ul class="qa">${
            c.notes.map(n => `<li><b>${esc(n.q)}</b>${esc(n.a)}</li>`).join("")}</ul></details>`
        : "";
      const packages = (c.packages || []).length
        ? `<details><summary>Packages &amp; other rates (${c.packages.length})</summary><ul class="qa">${
            c.packages.map(p => `<li>${esc(p)}</li>`).join("")}</ul></details>`
        : "";
      const links = (c.links || []).map(l =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ");

      return `<tr>
        <td class="name-cell">
          <div class="name">${esc(c.name)}</div>
          <a href="${esc(mapsLink(c))}" target="_blank" rel="noopener">📍 ${esc(c.address || "Open in Google Maps")}</a>
          ${c.contact ? `<div class="muted">${esc(c.contact)}</div>` : ""}
          ${links ? `<div>${links}</div>` : ""}
          ${c.visited ? `<div class="muted">Visited ${esc(c.visited)}</div>` : ""}
          ${packages}
          ${notes}
        </td>
        ${rateCells}
        <td data-label="Schedule">${esc(c.schedule) || '<span class="muted">—</span>'}</td>
      </tr>`;
    }).join("");
  }

  function render() { computeBest(); renderSummary(); renderRows(); }
  document.getElementById("sort").addEventListener("change", renderRows);
  modeEl.addEventListener("change", render);
  render();
</script>
</body>
</html>
